<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Risk Report</title>
<style>
  :root{
    --bg: #0a0d12;
    --panel: #10141c;
    --panel-2: #141926;
    --border: #212836;
    --border-soft: #1a2029;
    --text: #e7eaf2;
    --muted: #7c869c;
    --muted-2: #59637a;
    --accent: #ff6a3d;
    --accent-dim: #7a3722;
    --teal: #2dd4c8;
    --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

  .app { max-width: 1280px; margin: 0 auto; padding: 28px 20px 60px; }

  .topbar {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 22px; padding-bottom: 16px; border-bottom: 1px solid var(--border-soft);
  }
  .brand { display:flex; align-items:center; gap: 10px; }
  .brand-dot { width:9px; height:9px; border-radius:50%; background: var(--accent); box-shadow: 0 0 10px 2px rgba(255,106,61,0.5); }
  .brand h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; margin: 0; color: var(--text); }
  .brand span { color: var(--muted-2); font-weight: 500; font-size: 12px; margin-left: 8px; text-transform: none; letter-spacing: 0; }
  .clock { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 940px) { .grid { grid-template-columns: 1fr; } }

  .col-form { display:flex; flex-direction:column; gap:14px; }

  .section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px 18px; }
  .section-head { display:flex; align-items:center; gap:8px; margin-bottom: 12px; }
  .section-num { font-family: var(--mono); font-size: 10px; color: var(--accent); background: var(--accent-dim); border-radius: 4px; padding: 2px 6px; letter-spacing: 0.05em; }
  .section-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }

  .row { display:grid; grid-template-columns: repeat(3,1fr); gap:10px; }
  .row + .row { margin-top: 10px; }
  .row.cols-2 { grid-template-columns: repeat(2,1fr); }
  .row.cols-1 { grid-template-columns: 1fr; }
  @media (max-width: 640px) { .row, .row.cols-2 { grid-template-columns: 1fr; } }

  label { display:block; font-size: 12px; color: #a6afc2; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.01em; }
  .field { position: relative; }
  input, textarea {
    width: 100%; background: #1a2030; border: 1.5px solid #2c3446; border-radius: 7px;
    color: #ffffff; font-family: var(--mono); font-size: 15px; font-weight: 500; padding: 11px 12px; outline: none;
    transition: border-color .15s ease, background .15s ease;
  }
  textarea { font-family: var(--sans); font-size: 14px; resize: vertical; min-height: 220px; line-height:1.6; }
  input::placeholder, textarea::placeholder { color: #545e73; opacity: 1; }
  input:focus, textarea:focus { border-color: var(--teal); background: #1e2637; }
  input[type="date"] { color-scheme: dark; cursor: pointer; }
  .label-edit {
    width: 100%; background: transparent; border: none; border-bottom: 1px dashed var(--border);
    color: var(--muted); font-family: var(--sans); font-size: 11px; font-weight: 500; padding: 0 0 4px 0; margin-bottom: 5px;
  }
  .label-edit:focus { outline:none; border-color: var(--teal); color: var(--text); }

  .date-row { display:flex; gap:6px; }
  .date-row input[type="text"] { flex: 1; }
  .cal-btn { flex: 0 0 auto; padding: 0 10px; font-size: 14px; line-height: 1; }
  .ip-info { font-family: var(--mono); font-size: 11px; color: var(--teal); margin-top: 6px; min-height: 14px; }
  .ip-info.pending { color: var(--muted); font-style: italic; }
  .ip-info.error { color: var(--accent); }

  .btn {
    appearance:none; border:none; cursor:pointer; font-family: var(--sans); font-weight: 600;
    font-size: 12.5px; border-radius: 7px; padding: 9px 14px; letter-spacing: 0.01em;
    transition: transform .1s ease, filter .15s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn-accent { background: var(--accent); color: #180b06; }
  .btn-accent:hover { filter: brightness(1.08); }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .btn-ghost:hover { border-color: var(--teal); color: var(--teal); }
  .btn-teal { background: var(--teal); color: #04211f; }
  .btn-teal:hover { filter: brightness(1.08); }

  .col-preview { position: sticky; top: 20px; display:flex; flex-direction: column; gap: 10px; }
  .preview-panel { background: #070a0f; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .preview-head { display:flex; align-items:center; justify-content:space-between; padding: 12px 16px; border-bottom: 1px solid var(--border-soft); background: var(--panel); }
  .preview-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); display:flex; align-items:center; gap:8px; }
  .dots { display:flex; gap:5px; }
  .dots span { width:8px; height:8px; border-radius:50%; }
  .dots span:nth-child(1){ background:#ff5f57; }
  .dots span:nth-child(2){ background:#febc2e; }
  .dots span:nth-child(3){ background:#28c840; }

  #output {
    white-space: pre-wrap; font-family: var(--mono); font-size: 12.5px; line-height: 1.65;
    color: #dbe4e8; padding: 18px 18px 20px; max-height: 620px; overflow-y: auto;
  }
  #output.editing { outline: 1px dashed var(--teal); outline-offset: -1px; cursor: text; }
  #output .lbl { color: #7ce0d6; }
  #output .val { color: #f2f5f2; }
  #output .empty-val { color: #4a5468; font-style: italic; }

  .preview-actions { display:flex; gap:8px; }
  .preview-actions .btn { flex:1; }

  .copied-flag { font-family: var(--mono); font-size: 11px; color: var(--teal); text-align:center; height: 14px; opacity: 0; transition: opacity .2s ease; }
  .copied-flag.show { opacity: 1; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>
<script>
  (function() {
    const SESSION_KEY = "secure_auth_session";
    try {
      const raw = localStorage.getItem(SESSION_KEY);
      if (!raw) { window.location.replace("login.html"); return; }
      const s = JSON.parse(raw);
      if (Date.now() > s.expiry) {
        localStorage.removeItem(SESSION_KEY);
        window.location.replace("login.html");
      }
    } catch(e) {
      window.location.replace("login.html");
    }
  })();
</script>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <div class="brand-dot"></div>
      <h1>Risk Report<span>fill once, copy formatted</span></h1>
    </div>
    <div class="clock" id="clock"></div>
  </div>

  <div class="grid">

    <div class="col-form">

      <div class="section">
        <div class="section-head"><span class="section-num">01</span><span class="section-title">Report Meta</span></div>
        <div class="row">
          <div class="field">
            <label>Date</label>
            <div class="date-row">
              <input id="date" type="text" placeholder="2025/06/01" autocomplete="off" maxlength="10">
              <button type="button" class="btn btn-ghost cal-btn" data-target="date" title="Pick date">&#128197;</button>
            </div>
            <input type="date" id="date_picker" style="display:none;">
          </div>
          <div class="field">
            <label>Platform</label>
            <input id="platform" type="text" list="platformList" autocomplete="off">
            <datalist id="platformList">
              <option value="B1"><option value="B2"><option value="B3"><option value="B4"><option value="B5">
              <option value="K1"><option value="M1"><option value="M2"><option value="M3">
              <option value="W1"><option value="G1"><option value="C1"><option value="VN9">
              <option value="D88"><option value="TK"><option value="G68"><option value="JW"><option value="ST">
            </datalist>
          </div>
          <div class="field">
            <label>Currency</label>
            <input id="currency" type="text" list="currencyList" autocomplete="off">
            <datalist id="currencyList">
              <option value="BDT"><option value="USD"><option value="VND"><option value="PKR">
              <option value="PHP"><option value="MYR"><option value="NPR"><option value="INR"><option value="LKR">
            </datalist>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-head"><span class="section-num">02</span><span class="section-title">Player</span></div>
        <div class="row cols-2">
          <div class="field"><label>Player (username)</label><input id="player" type="text"></div>
          <div class="field">
            <label>Registration Time</label>
            <div class="date-row">
              <input id="regTime" type="text" placeholder="2025/06/01" autocomplete="off" maxlength="10">
              <button type="button" class="btn btn-ghost cal-btn" data-target="regTime" title="Pick date">&#128197;</button>
            </div>
            <input type="date" id="regTime_picker" style="display:none;">
          </div>
        </div>
        <div class="row cols-1">
          <div class="field">
            <label>Sign Up IP</label>
            <input id="signupIp" type="text" autocomplete="off">
            <div class="ip-info" id="ipInfo"></div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-head"><span class="section-num">03</span><span class="section-title">Lifetime Summary</span></div>
        <div class="row cols-2">
          <div class="field"><label>Total Deposit</label><input id="totalDeposit" class="num" type="text" inputmode="decimal"></div>
          <div class="field"><label>Total Withdrawal</label><input id="totalWithdrawal" class="num" type="text" inputmode="decimal"></div>
        </div>
        <div class="row cols-2">
          <div class="field"><label>Total Bonus</label><input id="totalBonus" class="num" type="text" inputmode="decimal"></div>
          <div class="field"><label>Win/Lose (lifetime)</label><input id="lifetimeWinLose" class="num winlose" type="text" inputmode="decimal" ></div>
        </div>
      </div>

      <div class="section">
        <div class="section-head"><span class="section-num">04</span><span class="section-title">Balance &amp; Today</span></div>
        <div class="row cols-1">
          <div class="field">
            <input class="label-edit" id="balanceLabel" type="text" value="Balance">
            <input id="balance" class="num" type="text" inputmode="decimal">
          </div>
        </div>
        <div class="row cols-2">
          <div class="field"><label>Today Deposit</label><input id="todayDeposit" class="num" type="text" inputmode="decimal"></div>
          <div class="field"><label>Today Withdrawals</label><input id="todayWithdrawal" class="num" type="text" inputmode="decimal"></div>
        </div>
        <div class="row cols-1">
          <div class="field"><label>Today Win/Lose</label><input id="todayWinLose" class="num winlose" type="text" inputmode="decimal"></div>
        </div>
      </div>

      <div class="section">
        <div class="section-head"><span class="section-num">05</span><span class="section-title">Game</span></div>
        <div class="row cols-2">
          <div class="field"><label>Game Name</label><input id="gameName" type="text"></div>
          <div class="field"><label>Turnover</label><input id="turnover" class="num" type="text" inputmode="decimal"></div>
        </div>
        <div class="row cols-2">
          <div class="field"><label>Win/Lose (game)</label><input id="gameWinLose" class="num winlose" type="text" inputmode="decimal"></div>
          <div class="field"><label>Betting Range</label><input id="bettingRange" type="text"></div>
        </div>
      </div>

      <div class="section">
        <div class="section-head"><span class="section-num">06</span><span class="section-title">Player Behavior</span></div>
        <div class="row cols-1">
          <div class="field"><textarea id="behavior" style="min-height:320px;"></textarea></div>
        </div>
      </div>

      <div class="section">
        <div class="section-head"><span class="section-num">07</span><span class="section-title">Linkage</span></div>
        <div class="row cols-2">
          <div class="field"><label>Account Linkage</label><input id="linkage" type="text"></div>
          <div class="field"><label>Shared Attributes</label><input id="sharedAttrs" type="text"></div>
        </div>
      </div>

      <div class="row cols-1" style="margin-top:2px;">
        <button class="btn btn-ghost" id="clearBtn">Clear all</button>
      </div>

    </div>

    <div class="col-preview">
      <div class="preview-panel">
        <div class="preview-head">
          <div class="preview-title"><span class="dots"><span></span><span></span><span></span></span>&nbsp;output.txt</div>
        </div>
        <div id="output" contenteditable="false"></div>
      </div>
      <div class="preview-actions">
        <button class="btn btn-teal" id="editBtn">Edit</button>
        <button class="btn btn-accent" id="copyBtn">Copy report</button>
      </div>
      <div class="copied-flag" id="copiedFlag">Copied to clipboard</div>
    </div>

  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const fields = ['date','platform','currency','player','regTime','signupIp',
  'totalDeposit','totalWithdrawal','totalBonus','lifetimeWinLose',
  'balanceLabel','balance','todayDeposit','todayWithdrawal','todayWinLose',
  'gameName','turnover','gameWinLose','bettingRange','behavior','linkage','sharedAttrs'];

let editMode = false;
let ipGeo = null;
let ipDebounceTimer = null;

function fmtDate(val){
  // Date fields are now free-typed/pasted text already kept in YYYY/MM/DD form.
  return (val || '').trim();
}

function formatDateInput(el){
  // Auto-inserts slashes as the user types or pastes digits (e.g. 20250601 -> 2025/06/01,
  // and also normalizes pasted "2025-06-01" or "2025.06.01" into the same shape).
  let digits = el.value.replace(/\D/g,'').slice(0,8);
  let out = digits;
  if (digits.length > 4) out = digits.slice(0,4) + '/' + digits.slice(4,6);
  if (digits.length > 6) out = digits.slice(0,4) + '/' + digits.slice(4,6) + '/' + digits.slice(6,8);
  el.value = out;
}

function attachDatePicker(textId, pickerId, btnSelector){
  const textEl = $(textId);
  const pickerEl = $(pickerId);
  pickerEl.addEventListener('change', () => {
    if (pickerEl.value) {
      const [y,m,d] = pickerEl.value.split('-');
      textEl.value = `${y}/${m}/${d}`;
      if (!editMode) render();
    }
  });
  document.querySelector(btnSelector).addEventListener('click', () => {
    if (pickerEl.showPicker) { pickerEl.showPicker(); } else { pickerEl.click(); }
  });
}

function filterNumeric(el){
  const allowParens = el.classList.contains('winlose');
  const disallowed = allowParens ? /[^0-9.\-()]/g : /[^0-9.\-]/g;
  let val = el.value.replace(disallowed, '');
  const parts = val.split('.');
  if (parts.length > 2) val = parts[0] + '.' + parts.slice(1).join('');
  if (!allowParens) {
    if (val.indexOf('-') > 0) val = val[0] === '-' ? '-' + val.replace(/-/g, '') : val.replace(/-/g, '');
    else val = val.replace(/(?!^)-/g, '');
  }
  el.value = val;
}

function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function getIpDisplayValue(){
  const raw = $('signupIp').value.trim();
  if (raw && ipGeo && (ipGeo.city || ipGeo.country)) {
    const parts = [ipGeo.country, ipGeo.city].filter(Boolean).join(' ');
    return `${raw} ${parts}`;
  }
  return raw;
}

function line(label, value, colonSpace){
  const v = value && value.trim() ? esc(value.trim()) : '';
  const sep = colonSpace ? ' :' : ':';
  const valHtml = v ? `<span class="val">${v}</span>` : `<span class="empty-val">&nbsp;</span>`;
  return `<span class="lbl">${esc(label)}${sep}</span> ${valHtml}`;
}

function render(){
  if (editMode) return; // don't clobber manual edits to the output while editing
  const balLabel = $('balanceLabel').value.trim() || 'Balance';
  const ipVal = getIpDisplayValue();

  const htmlLines = [
    line('Date', fmtDate($('date').value), false),
    line('Platform', $('platform').value, false),
    line('Currency', $('currency').value, false),
    '',
    line('Player', $('player').value, false),
    line('Registration Time', fmtDate($('regTime').value), true),
    line('Sign Up IP', ipVal, true),
    line('Total Deposit', $('totalDeposit').value, true),
    line('Total Withdrawal', $('totalWithdrawal').value, true),
    line('Total bonus', $('totalBonus').value, true),
    line('Win/Lose', $('lifetimeWinLose').value, true),
    '',
    line(balLabel, $('balance').value, true),
    line('Today Deposit', $('todayDeposit').value, true),
    line('Today Withdrawals', $('todayWithdrawal').value, true),
    line('Today Win/Lose', $('todayWinLose').value, true),
    '',
    line('Game name', $('gameName').value, true),
    line('Turnover', $('turnover').value, true),
    line('Win/Lose', $('gameWinLose').value, true),
    line('Betting range', $('bettingRange').value, true),
    line('Player Behavior', $('behavior').value, true),
    '',
    line('Account linkage', $('linkage').value.trim() || 'None', true),
    line('Shared attributes', $('sharedAttrs').value.trim() || 'None', false),
  ];
  $('output').innerHTML = htmlLines.join('\n');
}

async function lookupSignupIp(ip){
  const infoEl = $('ipInfo');
  infoEl.className = 'ip-info pending';
  infoEl.textContent = 'Looking up...';
  try {
    const res = await fetch(`https://ipwho.is/${encodeURIComponent(ip)}`);
    const data = await res.json();
    if (data && data.success) {
      ipGeo = { city: data.city || '', country: data.country || '' };
      infoEl.className = 'ip-info';
      infoEl.textContent = [ipGeo.country || 'Unknown country', ipGeo.city || 'Unknown city'].join(' ');
    } else {
      ipGeo = null;
      infoEl.className = 'ip-info error';
      infoEl.textContent = data && data.message ? data.message : 'Location not found';
    }
  } catch (e) {
    ipGeo = null;
    infoEl.className = 'ip-info error';
    infoEl.textContent = 'Lookup failed (network/ad-blocker)';
  }
  if (!editMode) render();
}

fields.forEach(id => {
  const el = $(id);
  el.addEventListener('input', () => {
    if (el.classList.contains('num')) filterNumeric(el);
    if (id === 'date' || id === 'regTime') formatDateInput(el);
    if (id === 'signupIp') {
      ipGeo = null;
      clearTimeout(ipDebounceTimer);
      const val = el.value.trim();
      if (val) {
        $('ipInfo').className = 'ip-info';
        $('ipInfo').textContent = '';
        ipDebounceTimer = setTimeout(() => lookupSignupIp(val), 600);
      } else {
        $('ipInfo').className = 'ip-info';
        $('ipInfo').textContent = '';
      }
    }
    if (!editMode) render();
  });
});

attachDatePicker('date', 'date_picker', '.cal-btn[data-target="date"]');
attachDatePicker('regTime', 'regTime_picker', '.cal-btn[data-target="regTime"]');

$('editBtn').addEventListener('click', () => {
  editMode = !editMode;
  const out = $('output');
  out.contentEditable = editMode ? 'true' : 'false';
  out.classList.toggle('editing', editMode);
  $('editBtn').textContent = editMode ? 'Done' : 'Edit';
  if (editMode) {
    out.focus();
  }
});

$('clearBtn').addEventListener('click', () => {
  fields.forEach(id => $(id).value = (id === 'balanceLabel' ? 'Balance' : ''));
  ipGeo = null;
  $('ipInfo').className = 'ip-info';
  $('ipInfo').textContent = '';
  if (editMode) { editMode = false; $('output').contentEditable = 'false'; $('output').classList.remove('editing'); $('editBtn').textContent = 'Edit'; }
  render();
});

$('copyBtn').addEventListener('click', () => {
  const text = $('output').innerText;
  navigator.clipboard.writeText(text).then(() => {
    const flag = $('copiedFlag');
    flag.classList.add('show');
    setTimeout(() => flag.classList.remove('show'), 1400);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    const flag = $('copiedFlag');
    flag.classList.add('show');
    setTimeout(() => flag.classList.remove('show'), 1400);
  });
});

function tickClock(){
  const now = new Date();
  $('clock').textContent = now.toLocaleString('en-GB', {
    weekday: 'short', year:'numeric', month:'short', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false
  });
}
tickClock();
setInterval(tickClock, 1000);

if (!$('date').value) {
  const d = new Date();
  $('date').value = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}

render();
</script>
</body>
</html>
